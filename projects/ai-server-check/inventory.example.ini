# 실제 inventory.ini 는 저장소에 올리지 않는다. 이 파일을 복사해 대상 호스트를 채운다.
[linux-virtual]
vm-host-01

[linux-physical]
pm-host-01

[all:vars]
ansible_connection=ssh
ansible_port=22

# Windows (OpenSSH, 기본 셸 cmd)
[windows]
win-host-01 ansible_host=<WINDOWS_IP> ansible_user=Administrator

[windows:vars]
ansible_shell_type=cmd
